[project]
name = "expertview"
version = "0.1.0"
description = "Multi-agent root-cause-analysis system for industrial manufacturing incidents. LangGraph + OpenRouter + domain-specific RAG."
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "Jacobo D'león" },
]
license = { text = "MIT" }
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "langgraph>=0.2",
    "langchain-core>=0.3",
    "langchain-openai>=0.2",
    "langchain-huggingface>=0.1",
    "langchain-community>=0.3",
    "sentence-transformers>=3.0",
    "langsmith>=0.1",
    "pydantic>=2.7",
    "structlog>=24.1",
    "rich>=13.7",
    "streamlit>=1.45",
    "streamlit-mermaid>=0.3.0",
]

[project.scripts]
expertview = "expertview.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "python-dotenv>=1.0",
    "ruff>=0.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/expertview"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "B",
    "UP",
    "N",
    "RUF",
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-ra"
markers = [
    "slow: tests that exercise the real embedding model or other multi-minute setup (still run by default)",
]
